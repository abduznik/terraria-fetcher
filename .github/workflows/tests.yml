name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  icon-slot-overflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run icon-slot overflow regression check
        run: npm test
